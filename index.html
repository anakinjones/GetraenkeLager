<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Getränke-Lagerverwaltung</title>
    <!-- QuaggaJS für zuverlässige 1D-Barcode- und Code-128-Erkennung -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        h2 {
            text-align: center;
            color: #ffc107;
            margin-bottom: 20px;
        }
        .card {
            background-color: #1E1E1E;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 14px;
            background-color: #2D2D2D;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        input:focus {
            outline: none;
            border-color: #ffc107;
            background-color: #333;
        }
        .barcode-row {
            display: flex;
            gap: 8px;
        }
        .barcode-row input {
            flex: 1;
        }
        .btn-scan {
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            height: 50px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-green { background-color: #198754; color: white; }
        .btn-red { background-color: #dc3545; color: white; }
        .btn-primary { background-color: #0d6efd; color: white; width: 100%; margin-top: 5px;}
        
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 16px;
        }
        .tab-btn {
            background-color: #2D2D2D;
            color: #aaa;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            flex: 1;
            text-align: center;
        }
        .tab-btn.active {
            background-color: #ffc107;
            color: #121212;
            border-color: #ffc107;
            font-weight: bold;
        }

        .item-row {
            background-color: #252525;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #ffc107;
        }
        .item-title { font-weight: bold; font-size: 16px; color: #fff; }
        .item-details { font-size: 14px; color: #aaa; margin-top: 6px; }

        /* Scanner Ansicht */
        #scannerContainer {
            display: none;
            margin-bottom: 15px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        #interactive.viewport {
            width: 100%;
            height: 250px;
            position: relative;
        }
        #interactive.viewport canvas, #interactive.viewport video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Login Overlay */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #121212;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .login-box {
            background-color: #1E1E1E;
            border: 1px solid #333;
            padding: 24px; border-radius: 12px;
            width: 80%; max-width: 320px; text-align: center;
        }
    </style>
</head>
<body>

<!-- PIN Login -->
<div id="loginOverlay">
    <div class="login-box">
        <h2>PIN eingeben</h2>
        <input type="password" id="pinInput" placeholder="PIN" inputmode="numeric" onkeydown="if(event.key === 'Enter') checkPin()">
        <button class="btn-primary" onclick="checkPin()">Entsperren</button>
    </div>
</div>

<!-- Hauptinhalt -->
<div class="container" id="appContent" style="display: none;">
    <h2>Getränke-Lager</h2>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('buchen')">Buchen</button>
        <button class="tab-btn" onclick="switchTab('bestand')">Bestand</button>
    </div>

    <!-- Ansicht: Buchen -->
    <div id="tabBuchen">
        <div class="card">
            <label for="barcode">Barcode / Pfandcode</label>
            <div class="barcode-row">
                <input type="text" id="barcode" placeholder="Scannen oder tippen..." autocomplete="off">
                <button class="btn-scan" onclick="toggleScanner()">📷 Scan</button>
            </div>

            <!-- Quagga Kamera-Vorschau -->
            <div id="scannerContainer">
                <div id="interactive" class="viewport"></div>
                <button class="btn-red" style="margin: 10px; width: calc(100% - 20px);" onclick="stoppeScanner()">Scanner schließen</button>
            </div>

            <label for="anzahl">Anzahl (Stk.)</label>
            <input type="number" id="anzahl" value="1" inputmode="numeric">

            <!-- Zusatzfelder für neue Artikel -->
            <div id="neuerArtikelFelder" style="display:none; border-top: 1px solid #333; padding-top: 12px; margin-top: 5px;">
                <p style="color: #ffc107; font-size: 14px; margin: 0 0 12px 0; font-weight: bold;">! Neuer Artikel – Details angeben:</p>
                <label>Marke</label>
                <input type="text" id="marke" placeholder="z.B. Paulaner">
                <label>Artikelname</label>
                <input type="text" id="name" placeholder="z.B. Spezi Kasten">
                <label>Füllmenge pro Stk. (Liter)</label>
                <input type="number" step="any" id="fuellmenge" placeholder="z.B. 0.5 oder 9.0" inputmode="decimal">
            </div>

            <div class="btn-group" style="margin-top: 15px;">
                <button class="btn-green" onclick="bucheEingang()">+ Eingang</button>
                <button class="btn-red" onclick="bucheAusgang()">- Ausgang</button>
            </div>
        </div>
    </div>

    <!-- Ansicht: Bestand -->
    <div id="tabBestand" style="display: none;">
        <div id="bestandsListe"></div>
    </div>
</div>

<script>
    const GEHEIME_PIN = "070807"; 
    let scannerLaeuft = false;

    function checkPin() {
        const eingegebenePin = document.getElementById('pinInput').value;
        if (eingegebenePin === GEHEIME_PIN) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            document.getElementById('barcode').focus();
            ladeBestand();
        } else {
            alert('Falsche PIN!');
            document.getElementById('pinInput').value = '';
        }
    }

    function switchTab(tab) {
        stoppeScanner();
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if (tab === 'buchen') {
            document.getElementById('tabBuchen').style.display = 'block';
            document.getElementById('tabBestand').style.display = 'none';
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('barcode').focus();
        } else {
            document.getElementById('tabBuchen').style.display = 'none';
            document.getElementById('tabBestand').style.display = 'block';
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            ladeBestand();
        }
    }

    function getLager() {
        return JSON.parse(localStorage.getItem('getraenkeLager') || '[]');
    }

    function speichereLager(lager) {
        localStorage.setItem('getraenkeLager', JSON.stringify(lager));
    }

    function playBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.value = 880;
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.12);
        } catch (e) {}
    }

    function toggleScanner() {
        if (scannerLaeuft) {
            stoppeScanner();
        } else {
            starteScanner();
        }
    }

    // Quagga Scanner für Code-128 starten
    function starteScanner() {
        const container = document.getElementById('scannerContainer');
        container.style.display = 'block';
        scannerLaeuft = true;

        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#interactive'),
                constraints: {
                    facingMode: "environment" // Rückkamera
                },
            },
            decoder: {
                readers: [
                    "code_128_reader", // Speziell für Code-128 / Pfandcodes
                    "ean_reader",
                    "ean_8_reader",
                    "code_39_reader"
                ]
            },
            locate: true
        }, function(err) {
            if (err) {
                console.error("Quagga Init Fehler:", err);
                alert("Kamera konnte nicht gestartet werden. Bitte erlaube den Zugriff in Safari.");
                container.style.display = 'none';
                scannerLaeuft = false;
                return;
            }
            Quagga.start();
        });

        Quagga.onDetected(onBarcodeDetected);
    }

    function onBarcodeDetected(result) {
        if (result && result.codeResult && result.codeResult.code) {
            const code = result.codeResult.code;
            playBeep();
            
            // Trage Code ins Feld ein
            document.getElementById('barcode').value = code;
            document.getElementById('barcode').dispatchEvent(new Event('input'));
            
            stoppeScanner();
        }
    }

    function stoppeScanner() {
        if (scannerLaeuft) {
            try {
                Quagga.stop();
                Quagga.offDetected(onBarcodeDetected);
            } catch (e) {}
            scannerLaeuft = false;
        }
        document.getElementById('scannerContainer').style.display = 'none';
    }

    // Live-Prüfung ob Barcode im Lager existiert
    document.getElementById('barcode').addEventListener('input', function() {
        const bc = this.value.trim();
        const lager = getLager();
        const artikel = lager.find(a => a.Barcode === bc);
        const zusatz = document.getElementById('neuerArtikelFelder');
        
        if (bc && !artikel) {
            zusatz.style.display = 'block';
        } else {
            zusatz.style.display = 'none';
        }
    });

    function bucheEingang() {
        stoppeScanner();
        const bc = document.getElementById('barcode').value.trim();
        const anz = parseInt(document.getElementById('anzahl').value);

        if (!bc || isNaN(anz) || anz <= 0) {
            alert('Bitte Barcode und gültige Anzahl eingeben!');
            return;
        }

        let lager = getLager();
        let artikel = lager.find(a => a.Barcode === bc);

        if (artikel) {
            artikel.Anzahl += anz;
            alert(`Bestand erhöht! Neuer Bestand für ${artikel.Name}: ${artikel.Anzahl} Stk.`);
        } else {
            const marke = document.getElementById('marke').value.trim();
            const name = document.getElementById('name').value.trim();
            const fuellmenge = parseFloat(document.getElementById('fuellmenge').value.toString().replace(',', '.'));

            if (!marke || !name || isNaN(fuellmenge) || fuellmenge <= 0) {
                alert('Bitte alle Felder für den neuen Artikel ausfüllen!');
                return;
            }

            lager.push({ Barcode: bc, Marke: marke, Name: name, Fuellmenge: fuellmenge, Anzahl: anz });
            alert('Neuer Artikel erfolgreich angelegt und gebucht!');
        }

        speichereLager(lager);
        felderLeeren();
    }

    function bucheAusgang() {
        stoppeScanner();
        const bc = document.getElementById('barcode').value.trim();
        const anz = parseInt(document.getElementById('anzahl').value);

        if (!bc || isNaN(anz) || anz <= 0) {
            alert('Bitte Barcode und gültige Anzahl eingeben!');
            return;
        }

        let lager = getLager();
        let artikel = lager.find(a => a.Barcode === bc);

        if (!artikel) {
            alert('Fehler: Artikel mit diesem Barcode wurde nicht gefunden!');
            return;
        }

        if (artikel.Anzahl >= anz) {
            artikel.Anzahl -= anz;
            speichereLager(lager);
            alert(`Ausgang gebucht! Neuer Bestand für ${artikel.Name}: ${artikel.Anzahl} Stk.`);
            felderLeeren();
        } else {
            alert(`Fehler: Zu wenige Artikel im Lager! (Aktueller Bestand: {artikel.Anzahl} Stk.)`);
        }
    }

    function felderLeeren() {
        document.getElementById('barcode').value = '';
        document.getElementById('anzahl').value = '1';
        document.getElementById('marke').value = '';
        document.getElementById('name').value = '';
        document.getElementById('fuellmenge').value = '';
        document.getElementById('neuerArtikelFelder').style.display = 'none';
        document.getElementById('barcode').focus();
    }

    function ladeBestand() {
        const lager = getLager();
        const container = document.getElementById('bestandsListe');
        container.innerHTML = '';

        const gefiltert = lager.filter(a => a.Anzahl > 0).sort((a, b) => a.Marke.localeCompare(b.Marke));

        if (gefiltert.length === 0) {
            container.innerHTML = '<p style="color: #ffc107; text-align: center; margin-top: 30px;">Das Lager ist aktuell leer.</p>';
            return;
        }

        gefiltert.forEach(item => {
            const gesamtLiter = item.Anzahl * item.Fuellmenge;
            const div = document.createElement('div');
            div.className = 'item-row';
            div.innerHTML = `
                <div class="item-title">${item.Marke} | ${item.Name}</div>
                <div class="item-details">
                    Füllmenge: ${item.Fuellmenge}L | Anzahl: <b>${item.Anzahl} Stk.</b><br>
                    Gesamt: <b>${gesamtLiter.toFixed(2)}L</b> (BC: ${item.Barcode})
                </div>
            `;
            container.appendChild(div);
        });
    }
</script>

</body>
</html>
